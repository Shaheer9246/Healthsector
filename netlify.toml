[build]
  command = "node build.js"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/adminsector"
  to = "/adminsector/"
  status = 301

[[redirects]]
  from = "/articles/*"
  to = "/articles/:splat.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
