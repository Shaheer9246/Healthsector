backend:
  name: github
  repo: YOUR_USERNAME/YOUR_REPO_NAME
  branch: main
  open_authoring: true

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"
publish_mode: editorial_workflow

collections:
  - name: "articles"
    label: "📰 Articles"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    delete: false
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "SEO Description", name: "description", widget: "text", required: true }
      - { label: "Publish Date", name: "date", widget: "datetime", required: true }
      - { label: "Last Reviewed", name: "reviewedDate", widget: "datetime", required: true }
      - { label: "Author", name: "author", widget: "relation", collection: "authors", value_field: "slug", display_fields: ["name"] }
      - { label: "Medical Reviewer", name: "reviewer", widget: "relation", collection: "authors", required: false }
      - { label: "Evidence Grade", name: "evidenceGrade", widget: "select", options: [{label:"High",value:"high"},{label:"Moderate",value:"moderate"},{label:"Low",value:"low"}], default: "moderate" }
      - { label: "Studies Cited", name: "studyCount", widget: "number", default: 0 }
      - { label: "Categories", name: "category", widget: "select", multiple: true, options: ["Nutrition","Brain Health","Cardiovascular","Diabetes","Mental Health","Fitness","Women's Health","Cancer"] }
      - { label: "Featured Image", name: "image", widget: "image", required: true }
      - { label: "Image Alt Text", name: "imageAlt", widget: "string", required: true }
      - { label: "Body", name: "body", widget: "markdown", required: true }

  - name: "authors"
    label: "👤 Authors"
    folder: "src/content/authors"
    create: true
    identifier_field: "name"
    fields:
      - { label: "Name", name: "name", widget: "string", required: true }
      - { label: "Credentials", name: "credentials", widget: "string" }
      - { label: "Bio", name: "bio", widget: "markdown" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Specialty", name: "specialty", widget: "string" }
